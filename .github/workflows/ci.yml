name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension test dependencies
        run: npm ci --prefix extension

      - name: Install Playwright browser
        run: npx --prefix extension playwright install --with-deps chromium

      - name: Validate Python syntax
        run: python -m compileall -q server tests

      - name: Lint Python
        run: python -m ruff check server tests

      - name: Test backend
        run: python -m pytest

      - name: Audit Python dependencies
        run: python -m pip_audit -r server/requirements.txt

      - name: Validate extension JavaScript syntax
        run: |
          node --check extension/apiClient.js
          node --check extension/debugLog.js
          node --check extension/domSelectors.js
          node --check extension/history.js
          node --check extension/sessionStore.js
          node --check extension/content.js
          node --check extension/background.js

      - name: Test extension pure logic
        run: node --test extension/tests/*.test.js

      - name: Test extension smoke fixture
        run: npm run test:smoke --prefix extension
